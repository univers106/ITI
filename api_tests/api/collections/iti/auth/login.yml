  url: localhost:8080/api/auth/login
  body:
    type: multipart-form
    data:
      - name: login
        type: text
        value: login
      - name: password
        type: text
        value: password
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
